<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline';">
  <title>Visual Tracker Offscreen</title>
</head>
<body>
  <canvas id="canvas" width="640" height="480" style="display: none;"></canvas>

  <script>
    console.log('📄 Offscreen document loading...');

    // Load MediaPipe scripts sequentially
    async function loadMediaPipeScripts() {
      const scripts = [
        'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js',
        'https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js',
        'https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js',
        'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js'
      ];

      for (const src of scripts) {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.crossOrigin = 'anonymous';
          script.onload = () => {
            console.log('✅ Loaded:', src.split('/').pop());
            resolve();
          };
          script.onerror = () => {
            console.error('❌ Failed to load:', src);
            reject(new Error(`Failed to load ${src}`));
          };
          document.head.appendChild(script);
        });
      }

      console.log('✅ All MediaPipe scripts loaded!');

      // Now load our offscreen.js
      const offscreenScript = document.createElement('script');
      offscreenScript.src = 'offscreen.js';
      offscreenScript.onload = () => console.log('✅ offscreen.js loaded');
      document.head.appendChild(offscreenScript);
    }

    loadMediaPipeScripts().catch(error => {
      console.error('❌ Failed to load MediaPipe:', error);
    });
  </script>
</body>
</html>
