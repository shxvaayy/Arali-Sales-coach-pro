<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 480px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: white;
      padding: 0;
      position: relative;
      overflow: hidden;
    }

    /* Animated background gradient */
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
      pointer-events: none;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 28px;
    }

    /* Header Section */
    .branding {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .branding::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
      border: 2px solid rgba(139, 92, 246, 0.3);
    }

    .company-info {
      flex: 1;
    }

    .company-name {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
      background: linear-gradient(135deg, #fff 0%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 12px;
      opacity: 0.8;
      margin: 4px 0 0 0;
      color: #c4b5fd;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* Content Card */
    .settings-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    h2 {
      margin: 0 0 20px 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.9;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      font-size: 11px;
      color: #c4b5fd;
    }

    .info {
      background: rgba(139, 92, 246, 0.15);
      border-left: 3px solid #8b5cf6;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 24px;
      font-size: 13px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .info-icon {
      font-size: 18px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Form Styling */
    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.3px;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      transition: all 0.3s ease;
      font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
      letter-spacing: 0.5px;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    input:focus {
      outline: none;
      border-color: #8b5cf6;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    /* Button Styling */
    button {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(139, 92, 246, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    /* Status Message */
    #status {
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
      display: none;
      animation: slideIn 0.3s ease;
      font-weight: 500;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .success {
      background: rgba(16, 185, 129, 0.2) !important;
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    /* Footer */
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      opacity: 0.5;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Features List */
    .features {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
    }

    .feature-icon {
      font-size: 16px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(139, 92, 246, 0.2);
      border-radius: 6px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="branding">
      <img src="icons/icon.png" class="logo" alt="Arali.ai Logo" />
      <div class="company-info">
        <h1 class="company-name">Arali.ai</h1>
        <p class="tagline">AI Sales Coach PRO</p>
      </div>
    </div>

    <div class="settings-card">
      <h2>⚙️ Configuration</h2>

      <div class="info">
        <span class="info-icon">💡</span>
        <div>Enter your OpenAI API key to enable real-time AI sales coaching and instant response suggestions</div>
      </div>

      <div class="input-group">
        <label>OpenAI API Key</label>
        <div class="input-wrapper">
          <input type="password" id="apiKey" placeholder="sk-proj-...">
        </div>
      </div>

      <button id="saveBtn">
        <span>💾 Save Configuration</span>
      </button>

      <div id="status"></div>

      <div class="features">
        <div class="feature-item">
          <span class="feature-icon">⚡</span>
          <span>Real-time speech recognition</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">🤖</span>
          <span>AI-powered sales suggestions</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">⌨️</span>
          <span>Keyboard shortcuts (Ctrl/Shift)</span>
        </div>
      </div>
    </div>

    <div class="footer">
      v3.6.4 • Powered by Arali.ai
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
